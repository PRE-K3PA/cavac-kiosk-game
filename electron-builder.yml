appId: com.cavac.kiosk
productName: CAVAC Kiosk
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: resources/default-species
    to: default-species
# 화면은 한국어·영어만 씁니다. Electron 언어 파일을 줄이면 Portable 이 켤 때마다 푸는 양도 줄어듭니다
electronLanguages:
  - ko
  - en-US
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: ${productName} Portable ${version}.${ext}
  # Portable 은 켤 때마다 앱 전체를 임시 폴더에 다시 풉니다. 기본 7z 는 풀어 둔 것을 한 번 더 복사하지만
  # zip 은 한 번에 풀어서 더 빨리 켜집니다 (#205)
  useZip: true
