appId: com.cavac.kiosk
productName: CAVAC Kiosk
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - dist-electron/**
  - package.json
afterPack: electron/scripts/after-pack.mjs
extraResources:
  - from: resources/default-species
    to: default-species
# 화면은 한국어·영어만 씁니다. Electron 언어 파일을 줄이면 Portable 이 켤 때마다 푸는 양도 줄어듭니다
electronLanguages:
  - ko
  - en-US
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
portable:
  artifactName: ${productName} Portable ${version}.${ext}
