name: check-exit-window

# 이슈 #209: Portable exe 를 끌 때 창이 잠깐 뜨는지 Windows 러너에서 확인합니다 (임시, PR 전에 지움)
#   patched: 앱이 끝난 직후 NSIS 를 바로 종료하도록(Quit) 고친 패치를 적용한 지금 브랜치 그대로
#   (수정 전 base 7/10, quit 실험판 0/10 은 run 44704609418)
on:
  push:
    branches: ["#209-fix-exit-nsis-window"]
  workflow_dispatch:

jobs:
  check:
    name: check-exit-window
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      # 배포 빌드는 마스터 PIN 해시가 없으면 실패합니다. 이 exe 는 러너 밖으로 내보내지 않으므로
      # 아무 PIN 으로 만든 해시를 씁니다
      - name: 확인용 마스터 PIN 해시 만들기
        shell: pwsh
        run: |
          $pin = "{0:D4}" -f (Get-Random -Maximum 10000)
          $line = $pin | bun electron/scripts/hash-pin.ts
          if ($line -notmatch "^MASTER_PIN_HASH=scrypt:") { throw "해시를 만들지 못했습니다" }
          Add-Content -Path $env:GITHUB_ENV -Value $line

      - name: Portable 템플릿 패치 적용 확인
        run: bun electron/scripts/verify-portable-patch.ts

      - name: 화면 빌드
        run: bun x vite build --mode release

      - name: Portable 빌드 (patched)
        run: bun x electron-builder --win portable --x64 --config.directories.output=builds/patched

      - name: 종료 때 창 확인
        shell: pwsh
        run: >-
          ./.github/scripts/check-exit-window.ps1 -BuildsRoot builds
          -Builds "patched" -Runs 5 -OutDir exit-window-results

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exit-window-results
          path: exit-window-results
          if-no-files-found: ignore
          retention-days: 7
